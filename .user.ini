; SmartLib PHP settings for hosts that run PHP as FastCGI / PHP-FPM / LSAPI
; (read by PHP itself; ignored under Apache mod_php, where .htaccess sets the
; same values). The root .htaccess denies this file over HTTP.
; No errors in responses (they still go to the error log).
display_errors = Off
display_startup_errors = Off
log_errors = On
; Session cookie: not readable by scripts, not sent on cross-site requests,
; and PHP refuses session IDs it did not create. The Secure flag is left to
; the host's PHP settings once the site is HTTPS-only.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
